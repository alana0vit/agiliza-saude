<style>
:root{
  --navy:#013a89; --navy-d:#012a66; --green:#0fbf8a; --green-d:#087a58; --teal:#0a8f9c;
  --bg:#f3f6fb; --card:#fff; --ink:#14233b; --muted:#56657d; --line:#dbe3ef;
  --soft:#e8f0fc; --soft-g:#e3f8f0; --danger:#b3261e; --warn-bg:#fff4d6; --warn-ink:#6b4a00;
  --radius:16px; --shadow:0 1px 2px rgba(1,58,137,.06),0 6px 20px rgba(1,58,137,.07);
}
body.hc{
  --navy:#fff; --navy-d:#fff; --green:#ffe600; --green-d:#ffe600; --teal:#ffe600;
  --bg:#000; --card:#000; --ink:#fff; --muted:#fff; --line:#fff;
  --soft:#000; --soft-g:#000; --danger:#ff8a80; --warn-bg:#000; --warn-ink:#ffe600; --shadow:none;
}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;padding-bottom:5.5rem}
h1,h2,h3{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--navy);line-height:1.2;margin:0}
h1{font-size:1.55rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
body.hc :focus-visible{outline-color:#ffe600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.6rem 1rem;z-index:100}
.skip:focus{left:0}

.teststrip{background:var(--warn-bg);color:var(--warn-ink);font-size:.8rem;text-align:center;padding:.35rem .75rem;border-bottom:1px solid var(--line)}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem}
.brand{display:flex;align-items:center;border:0;background:none;padding:0;margin-right:auto}
.brand img{height:2.6rem;width:auto;display:block}
body.hc .brand img{background:#fff;border-radius:8px;padding:2px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:999px;min-height:2.75rem;padding:0 .9rem;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.4rem}
.topnav{display:none;gap:.25rem;margin-right:.5rem}
.topnav button{border:0;background:none;padding:.6rem .8rem;border-radius:10px;font-weight:600;color:var(--muted)}
.topnav button[aria-current=page]{color:var(--navy);background:var(--soft)}

main{max-width:880px;margin:0 auto;padding:1.1rem 1rem 2rem}
.stack>*+*{margin-top:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center}
.row{display:flex;gap:.75rem;align-items:center} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}

.hero{background:linear-gradient(135deg,#013a89 0%,#0a6f9c 60%,#0fbf8a 130%);color:#fff;border-radius:22px;padding:1.4rem 1.2rem;position:relative;overflow:hidden}
body.hc .hero{background:#000;border:2px solid #fff}
.hero h1{color:#fff;font-size:1.6rem;max-width:20ch}
.hero p{opacity:.92;margin-top:.5rem;max-width:36ch}
.hero .btn{margin-top:1rem}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.7rem 1.2rem;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:1rem;text-decoration:none;background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-d)}
.btn.green{background:#0fbf8a;color:#00301f} .btn.green:hover{background:#0aa878}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
body.hc .btn{background:#ffe600;color:#000} body.hc .btn.ghost,body.hc .btn.danger{background:#000;color:#fff;border-color:#fff}
.linkbtn{background:none;border:0;padding:.5rem 0;color:var(--navy);font-weight:700;text-decoration:underline;min-height:2.75rem}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.35rem;min-height:7rem}
.tile:hover{border-color:var(--navy)}
.tile b{color:var(--navy);font-size:1rem}
.tile span.d{color:var(--muted);font-size:.85rem}
.emo{width:2.6rem;height:2.6rem;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.4rem;flex:none}
.emo.g{background:var(--soft-g)}

.steps{display:flex;gap:.3rem;margin:.6rem 0 0}
.steps i{flex:1;height:.4rem;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--green)}
.back{background:none;border:0;color:var(--navy);font-weight:700;padding:.5rem .5rem .5rem 0;min-height:2.75rem}

.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.85rem;min-height:4rem}
.opt:hover{border-color:var(--navy)}
.opt[aria-pressed=true],.opt.sel{border-color:var(--green-d);background:var(--soft-g)}
.opt b{display:block;color:var(--ink)}
.opt .chev{margin-left:auto;color:var(--muted);font-size:1.3rem}
.list{display:grid;gap:.6rem}
.grid2{display:grid;gap:.6rem;grid-template-columns:1fr}

label.f{display:block;font-weight:700;font-size:.95rem;margin-bottom:.3rem}
.inp{width:100%;min-height:3rem;border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--card)}
.inp:focus{border-color:var(--navy);outline:none}
.hint{font-size:.82rem;color:var(--muted);margin-top:.25rem}
.err{color:var(--danger);font-size:.85rem;font-weight:600;margin-top:.25rem}
.fgrid{display:grid;gap:.9rem}

.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.45rem .9rem;min-height:2.75rem;font-weight:600;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
body.hc .chip[aria-pressed=true]{background:#ffe600;color:#000;border-color:#ffe600}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:.15rem .6rem;background:var(--soft);color:var(--navy)}
.tag.g{background:var(--soft-g);color:var(--green-d)} .tag.r{background:#fde8e6;color:var(--danger)} .tag.y{background:var(--warn-bg);color:var(--warn-ink)}
body.hc .tag{border:1px solid #fff}

.unit{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;box-shadow:var(--shadow)}
.unit h3{font-size:1.02rem}
.unit .meta{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.unit .next{font-weight:700;color:var(--green-d);font-size:.92rem}
.unit .acts{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.unit .acts .btn{min-height:2.75rem;padding:.5rem 1rem;font-size:.95rem}

.days{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem .1rem .6rem;scroll-snap-type:x proximity}
.day{flex:none;width:5.2rem;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.55rem .3rem;text-align:center;scroll-snap-align:start}
.day .w{font-size:.78rem;text-transform:uppercase;color:var(--muted);font-weight:700}
.day .n{font-size:1.35rem;font-weight:800;color:var(--navy);line-height:1.1}
.day .v{font-size:.72rem;font-weight:700;color:var(--green-d)}
.day.none{opacity:.55} .day.none .v{color:var(--danger)}
.day[aria-pressed=true]{border-color:var(--green-d);background:var(--soft-g)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.5rem}
.time{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:3rem;font-weight:700;font-size:1.02rem}
.time:hover{border-color:var(--navy)}
.time[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
body.hc .time[aria-pressed=true]{background:#ffe600;color:#000}
.period{font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin:.9rem 0 .4rem}

dl.sum{margin:0;display:grid;gap:.7rem}
dl.sum div{display:flex;gap:.75rem;align-items:flex-start}
dl.sum dt{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
dl.sum dd{margin:0;font-weight:600}
.ok{width:4.2rem;height:4.2rem;border-radius:50%;background:var(--soft-g);color:var(--green-d);display:grid;place-items:center;font-size:2.2rem;margin:0 auto .6rem;font-weight:800}
.proto{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;background:var(--soft);border-radius:8px;padding:.2rem .5rem;display:inline-block}
.faces{display:flex;gap:.4rem;justify-content:space-between}
.face{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.5rem .2rem;font-size:1.6rem;min-height:4rem}
.face small{display:block;font-size:.68rem;font-weight:700;color:var(--muted)}
.face[aria-pressed=true]{border-color:var(--green-d);background:var(--soft-g)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{border:0;background:none;padding:.5rem .2rem .55rem;font-size:.74rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.1rem;min-height:3.6rem}
nav.bottom button span{font-size:1.3rem;line-height:1.2}
nav.bottom button[aria-current=page]{color:var(--navy);box-shadow:inset 0 3px 0 var(--green)}

.overlay{position:fixed;inset:0;background:rgba(5,20,45,.55);display:grid;place-items:end center;z-index:50;padding:0}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:1.2rem;width:100%;max-width:520px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:6rem;background:#14233b;color:#fff;padding:.7rem 1rem;border-radius:12px;z-index:60;max-width:90vw;font-weight:600;font-size:.92rem}
body.hc .toast{background:#ffe600;color:#000}
table.log{width:100%;border-collapse:collapse;font-size:.78rem}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
.scroll{overflow:auto}
footer.ft{max-width:880px;margin:0 auto;padding:0 1rem 1rem;color:var(--muted);font-size:.8rem;text-align:center}

@media(min-width:760px){
  body{padding-bottom:1rem}
  nav.bottom{display:none}
  .topnav{display:flex}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .grid2{grid-template-columns:1fr 1fr}
  .overlay{place-items:center;padding:1rem}
  .modal{border-radius:20px}
  .toast{bottom:2rem}
  h1{font-size:1.8rem}
  .hero{padding:2rem}
  .hero h1{font-size:2rem}
}
@media(prefers-reduced-motion:no-preference){
  .btn,.opt,.tile,.time,.day,.chip{transition:background .15s,border-color .15s}
  main{animation:in .2s ease}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>

function hash(str){let x=2166136261;for(let i=0;i<str.length;i++){x=Math.imul(x^str.charCodeAt(i),16777619);}
  x^=x>>>13;x=Math.imul(x,0x5bd1e995);x^=x>>>15;return (x>>>0)/4294967296;}

/* ============================= DATAS ================================ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MOL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtLong=s=>{const d=fromIso(s);return WDL[d.getDay()]+', '+d.getDate()+' de '+MOL[d.getMonth()];};
const fmtShort=s=>{const d=fromIso(s);return WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1);};
function nextDays(n=21){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let i=1;i<=n;i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push(x);}return out;}

/* ============================= VAGAS ================================ */
function baseTimes(u){const t=[];const add=(h1,m1,h2,m2)=>{for(let m=h1*60+m1;m<=h2*60+m2;m+=30)t.push(pad(Math.floor(m/60))+':'+pad(m%60));};
  add(7,30,11,30);add(13,0,16,30);if(u.noite)add(17,0,19,30);return t;}
function appts(){return store.get('appts',[]);}
function slots(u,sid,dateIso,ignoreId){
  const d=fromIso(dateIso),wd=d.getDay();
  if(wd===0||(wd===6&&!u.sabado))return null; // fechada
  const k=u.id+'|'+sid+'|'+dateIso;const f=hash(k+'|dia');
  if(f<.18||(sid!=='clinico'&&hash(u.id+'|'+sid+'|lotada')<.07))return []; // dia esgotado ou agenda lotada
  const diff=Math.round((d-new Date().setHours(0,0,0,0))/864e5);
  let p=.12+.5*f; if(diff<=2)p*=.45; if(sid==='vacina')p+=.2;
  let times=baseTimes(u); if(wd===6)times=times.filter(t=>t<'12:00');
  const taken=new Set(appts().filter(a=>a.status==='agendada'&&a.unitId===u.id&&a.svc===sid&&a.date===dateIso&&a.id!==ignoreId).map(a=>a.time));
  return times.filter(t=>hash(k+'|'+t)<p&&!taken.has(t));
}
function nextSlot(u,sid){for(const d of nextDays()){const s=slots(u,sid,iso(d));if(s&&s.length)return {date:iso(d),time:s[0],n:s.length};}return null;}

/* ============================ DISTÂNCIA ============================= */
function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function ref(){return store.get('ref',null);} // {lat,lng,label}
function dist(u){const r=ref();return r?km(r,u):null;}
const fmtKm=k=>k<1?Math.round(k*100)*10+' m':k.toFixed(1).replace('.',',')+' km';

}

function wizHead(title,sub){const n=5;return `<div><button class="back" data-act="wback">← Voltar</button>
  <p class="muted small" aria-hidden="true">Passo ${W.step} de ${n}${W.editId?' · Remarcação':''}</p>
  <div class="steps" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${W.step}" aria-label="Passo ${W.step} de ${n}">${Array.from({length:n},(_,i)=>`<i class="${i<W.step?'on':''}"></i>`).join('')}</div>
  <h1 style="margin-top:.9rem">${title}</h1>${sub?`<p class="muted" style="margin-top:.3rem">${sub}</p>`:''}</div>`;}

function wizard(){
  if(!profile())return identify(true);
  if(!W)newWizard();
  const p=profile();
  if(W.step===1){const deps=store.get('deps',[]);
    return `<div class="stack">${wizHead('Para quem é a consulta?','Você pode marcar para você ou para alguém que acompanha.')}
    <div class="list">
      <button class="opt" data-act="pac" data-i="-1"><span class="emo g" aria-hidden="true">🙂</span><span><b>Para mim</b><span class="muted small">${esc(p.nome)}</span></span><span class="chev" aria-hidden="true">›</span></button>
      ${deps.map((d,i)=>`<button class="opt" data-act="pac" data-i="${i}"><span class="emo" aria-hidden="true">🤝</span><span><b>${esc(d.nome)}</b><span class="muted small">${esc(d.rel)}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}
      <button class="opt" data-act="newdep"><span class="emo" aria-hidden="true">➕</span><span><b>Outra pessoa</b><span class="muted small">Filho(a), pai, mãe, idoso que você acompanha…</span></span><span class="chev" aria-hidden="true">›</span></button>
    </div></div>`;}
  if(W.step===2){return `<div class="stack">${wizHead('Qual atendimento você precisa?')}
    <div class="grid2">${SERVICES.map(s=>`<button class="opt" data-act="svc" data-id="${s.id}"><span class="emo" aria-hidden="true">${s.e}</span><span><b>${s.nome}</b><span class="muted small">${s.desc}</span></span><span class="chev" aria-hidden="true">›</span></button>`).join('')}</div></div>`;}
  if(W.step===3){return `<div class="stack">${wizHead('Escolha a unidade','Unidades com '+SVC[W.svc].nome.toLowerCase()+'.')}${unitFilters(true)}<div id="ulist" class="list">${unitList(W.svc,true)}</div></div>`;}
  if(W.step===4){const u=UNITS[W.unitId];const days=nextDays();
    if(!W.date){const f=days.find(d=>{const s=slots(u,W.svc,iso(d),W.editId);return s&&s.length;});W.date=f?iso(f):iso(days[0]);}
    const sl=slots(u,W.svc,W.date,W.editId);
    const grp=[['Manhã',t=>t<'12:00'],['Tarde',t=>t>='12:00'&&t<'17:00'],['Noite',t=>t>='17:00']];
    return `<div class="stack">${wizHead('Escolha o dia e o horário',esc(SVC[W.svc].nome)+' · '+esc(u.nome))}
    <div><h2 class="sr">Dias</h2><div class="days" role="group" aria-label="Dias disponíveis">${days.map(d=>{const s=slots(u,W.svc,iso(d),W.editId);const n=s?s.length:0;
      return `<button class="day ${n?'':'none'}" data-act="day" data-d="${iso(d)}" aria-pressed="${W.date===iso(d)}" aria-label="${WDL[d.getDay()]}, ${d.getDate()} de ${MOL[d.getMonth()]}: ${s===null?'unidade fechada':n?n+' vagas':'sem vagas'}"><div class="w">${WD[d.getDay()]}</div><div class="n">${d.getDate()}</div><div class="w">${MO[d.getMonth()]}</div><div class="v">${s===null?'fechada':n?n+(n>1?' vagas':' vaga'):'sem vagas'}</div></button>`;}).join('')}</div>
      <p class="muted small">Arraste para o lado para ver mais dias.</p></div>
    <section class="card"><h2>${esc(fmtLong(W.date))}</h2>
    ${sl===null?`<p class="muted" style="margin-top:.5rem">A unidade não abre neste dia. Escolha outro dia acima.</p>`:
      !sl.length?`<p style="margin-top:.5rem"><span class="tag r">Sem vagas</span></p><p class="muted" style="margin-top:.4rem">Todas as vagas deste dia já foram preenchidas. Escolha outro dia ou <button class="linkbtn" data-act="otherunit" style="padding:0;min-height:0">veja outra unidade</button>.</p>`:
      grp.map(g=>{const ts=sl.filter(g[1]);return ts.length?`<p class="period">${g[0]}</p><div class="times">${ts.map(t=>`<button class="time" data-act="time" data-t="${t}" aria-pressed="${W.time===t}">${t}</button>`).join('')}</div>`:'';}).join('')}
    </section>
    <button class="btn block" data-act="wnext" ${W.time?'':'disabled'}>Continuar</button></div>`;}
  if(W.step===5){const u=UNITS[W.unitId];
    return `<div class="stack">${wizHead(W.editId?'Confirme a remarcação':'Confira e confirme')}
    <section class="card">${summary(W)}</section>
    <section class="card"><label class="row" style="align-items:flex-start;cursor:pointer"><input type="checkbox" id="lemb" ${W.lembrete?'checked':''} style="width:1.5rem;height:1.5rem;flex:none;margin-top:.1rem"><span><b>Quero receber lembrete</b><br><span class="muted small">Por WhatsApp/SMS no número ${esc(p.fone)}, um dia antes da consulta.</span></span></label></section>
    <button class="btn green block" data-act="confirm">✓ ${W.editId?'Confirmar remarcação':'Confirmar agendamento'}</button>
    <button class="btn ghost block" data-act="wback">Alterar horário</button></div>`;}
}
function summary(a){const u=UNITS[a.unitId];return `<dl class="sum">
  <div><span class="emo" aria-hidden="true">${SVC[a.svc].e}</span><span><dt>Atendimento</dt><dd>${esc(SVC[a.svc].nome)}</dd></span></div>
  <div><span class="emo g" aria-hidden="true">📅</span><span><dt>Data e horário</dt><dd>${esc(fmtLong(a.date))}, às ${a.time}</dd></span></div>
  <div><span class="emo" aria-hidden="true">📍</span><span><dt>Unidade</dt><dd>${esc(u.nome)}</dd><span class="muted small">${esc(u.end)} · ${esc(u.bairro)}</span></span></div>
  <div><span class="emo g" aria-hidden="true">🙂</span><span><dt>Paciente</dt><dd>${esc(a.paciente.nome)}${a.paciente.rel?' <span class="muted small">('+esc(a.paciente.rel)+')</span>':''}</dd></span></div></dl>`;}

function unitFilters(inWizard){const r=ref();
  return `<section class="card stack" aria-label="Filtros">
  <div><label class="f" for="uq">Buscar unidade ou bairro</label><input class="inp" id="uq" type="search" placeholder="Ex.: Prazeres, Curado, Vila Rica" value="${esc(UF.q)}" autocomplete="off"></div>
  <div class="row wrap"><button class="btn ghost" data-act="geo" style="min-height:2.75rem">📍 Usar minha localização</button>
    <div class="grow" style="min-width:11rem"><label class="sr" for="ub">Meu bairro</label><select class="inp" id="ub"><option value="">Ou escolha seu bairro…</option>${BAIRROS.map(b=>`<option ${UF.bairro===b?'selected':''}>${esc(b)}</option>`).join('')}</select></div></div>
  ${r?`<p class="small muted">Ordenando por distância a partir de <b>${esc(r.label)}</b> (distâncias aproximadas). <button class="linkbtn" data-act="clearref" style="padding:0;min-height:0">Limpar</button></p>`:''}
  ${inWizard?'':`<div><label class="f" for="us">Serviço</label><select class="inp" id="us"><option value="">Todos os serviços</option>${SERVICES.map(s=>`<option value="${s.id}" ${UF.svc===s.id?'selected':''}>${s.nome}</option>`).join('')}</select></div>`}
  <div class="chips" role="group" aria-label="Horários de funcionamento">
    <button class="chip" data-act="fnoite" aria-pressed="${UF.noite}">🌙 Abre à noite</button>
    <button class="chip" data-act="fsab" aria-pressed="${UF.sabado}">Abre aos sábados</button>
    ${inWizard?`<button class="chip" data-act="fsort" aria-pressed="${UF.sort==='vaga'}">⏱ Vaga mais cedo</button>`:''}
  </div></section>`;}
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function unitList(svc,inWizard){
  const q=norm(UF.q.trim());
  let us=UNITS.filter(u=>(!svc||u.servicos.includes(svc))&&(!UF.noite||u.noite)&&(!UF.sabado||u.sabado)&&(!q||norm(u.nome+' '+u.bairro+' '+u.end).includes(q)));
  let rows=us.map(u=>({u,d:dist(u),nx:svc?nextSlot(u,svc):null}));
  if(inWizard&&UF.sort==='vaga')rows.sort((a,b)=>((a.nx?a.nx.date+a.nx.time:'9')).localeCompare(b.nx?b.nx.date+b.nx.time:'9'));
  else if(ref())rows.sort((a,b)=>a.d-b.d);
  else rows.sort((a,b)=>a.u.nome.localeCompare(b.u.nome,'pt-BR'));
  if(!rows.length)return `<div class="card center"><p><b>Nenhuma unidade encontrada.</b></p><p class="muted small">Tente tirar algum filtro ou buscar por outro bairro.</p></div>`;
  const shown=rows.slice(0,UF.limit);
  return `<p class="muted small" role="status">${rows.length} unidade${rows.length>1?'s':''} encontrada${rows.length>1?'s':''}</p>`+shown.map(({u,d,nx})=>`<article class="unit">
    <div class="row" style="align-items:flex-start"><div class="grow"><h3>${esc(u.nome)}</h3><p class="muted small">${esc(u.end)} · ${esc(u.bairro)}</p></div>${d!=null?`<span class="tag" title="Distância aproximada">≈ ${fmtKm(d)}</span>`:''}</div>
    <div class="meta">${u.noite?'<span class="tag y">🌙 Até 20h</span>':''}${u.sabado?'<span class="tag y">Sábado</span>':''}${u.acess?'<span class="tag">♿ Acessível</span>':''}</div>
    ${svc?(nx?`<p class="next">Próxima vaga: ${esc(fmtShort(nx.date))} às ${nx.time}</p>`:`<p><span class="tag r">Sem vagas nas próximas 3 semanas</span></p>`):`<p class="muted small">${u.servicos.length} serviços disponíveis</p>`}
    <div class="acts">${inWizard?`<button class="btn" data-act="pickunit" data-id="${u.id}" ${nx?'':'disabled'}>Ver horários</button>`:`<button class="btn" data-go="#/unidade/${u.id}">Ver unidade</button>`}
      <a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.nome+', '+u.end+', Jaboatão dos Guararapes - PE')}">Como chegar</a></div>
  </article>`).join('')+(rows.length>UF.limit?`<button class="btn ghost block" data-act="more">Mostrar mais unidades</button>`:'');
}
function unitsPage(){return `<div class="stack"><div><h1>Unidades de saúde</h1><p class="muted" style="margin-top:.3rem">${UNITS.length} unidades em Jaboatão dos Guararapes.</p></div>${unitFilters(false)}<div id="ulist" class="list">${unitList(UF.svc,false)}</div></div>`;}
function unitPage(id){const u=UNITS[id];if(!u)return unitsPage();const d=dist(u);
  return `<div class="stack"><button class="back" data-go="#/unidades">← Unidades</button>
  <section class="card"><h1>${esc(u.nome)}</h1><p class="muted" style="margin-top:.3rem">${esc(u.end)} · ${esc(u.bairro)}${d!=null?' · ≈ '+fmtKm(d):''}</p>
    <div class="unit" style="border:0;box-shadow:none;padding:0"><div class="meta">${u.noite?'<span class="tag y">🌙 Até 20h</span>':''}${u.sabado?'<span class="tag y">Sábado</span>':''}${u.acess?'<span class="tag">♿ Acessível</span>':''}</div></div>
    <p class="small"><b>Funcionamento:</b> seg a sex, 7h30 às ${u.noite?'20h':'17h'}${u.sabado?' · sáb, 7h30 às 12h':''}</p>
    <p style="margin-top:.7rem"><a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(u.nome+', '+u.end+', Jaboatão dos Guararapes - PE')}">🗺 Como chegar</a></p></section>
  <h2>Atendimentos nesta unidade</h2>
  <div class="list">${u.servicos.map(s=>{const nx=nextSlot(u,s);return `<button class="opt" data-act="unitsvc" data-u="${u.id}" data-s="${s}" ${nx?'':'disabled'}><span class="emo" aria-hidden="true">${SVC[s].e}</span><span><b>${SVC[s].nome}</b><span class="small ${nx?'':'muted'}" style="${nx?'color:var(--green-d);font-weight:700':''}">${nx?'Próxima vaga: '+esc(fmtShort(nx.date))+' às '+nx.time:'Sem vagas no momento'}</span></span><span class="chev" aria-hidden="true">›</span></button>`;}).join('')}</div></div>`;}

function identify(inFlow){const p=profile()||{};
  return `<div class="stack"><div>${inFlow?'<button class="back" data-go="#/">← Voltar</button>':''}<h1>${profile()?'Meus dados':'Identifique-se'}</h1><p class="muted" style="margin-top:.3rem">${profile()?'Atualize seus dados de contato.':'Só precisamos disso uma vez. Depois, agendar leva menos de um minuto.'}</p></div>
  <form class="card fgrid" id="fid" novalidate>

  </form>
  ${profile()&&!inFlow?`<p class="center"><button class="linkbtn" data-act="logout">Sair e apagar meus dados deste aparelho</button></p>`:''}</div>`;}

function successPage(id){const a=appts().find(x=>x.id===id);if(!a)return home();const fb=store.get('fb_'+id,null);
  return `<div class="stack">
  <section class="card center"><div class="ok" aria-hidden="true">✓</div><h1>${a.remarcada?'Consulta remarcada!':'Consulta agendada!'}</h1>
    <p class="muted" style="margin-top:.4rem">Protocolo <span class="proto">${a.protocolo}</span></p>${a.lembrete?`<p class="small muted" style="margin-top:.4rem">Você receberá um lembrete um dia antes.</p>`:''}</section>
  <section class="card">${summary(a)}</section>
  <section class="card"><h2>No dia da consulta</h2><ul class="muted" style="margin:.5rem 0 0;padding-left:1.2rem;display:grid;gap:.3rem"><li>Leve documento com foto e Cartão SUS.</li><li>Chegue 15 minutos antes do horário.</li><li>Se não puder ir, remarque ou cancele para liberar a vaga.</li></ul></section>

  <section class="card stack" id="fbbox">${fb?`<p class="center"><b>Obrigado pela sua opinião! 💚</b></p>`:`<h2>Foi fácil agendar?</h2><p class="muted small">Sua resposta ajuda a melhorar o Agiliza Saúde.</p>
    <div class="faces" role="group" aria-label="Nota de 1 a 5">${[['😣','Muito difícil'],['🙁','Difícil'],['😐','Normal'],['🙂','Fácil'],['😄','Muito fácil']].map((f,i)=>`<button class="face" data-act="face" data-n="${i+1}" aria-pressed="false" aria-label="${i+1} — ${f[1]}">${f[0]}<small>${f[1]}</small></button>`).join('')}</div>
    <div><label class="f" for="fbt">Quer contar o que achou? (opcional)</label><textarea class="inp" id="fbt" rows="3" placeholder="O que foi bom? O que foi confuso?"></textarea></div>
    <button class="btn block" data-act="sendfb" data-id="${a.id}">Enviar opinião</button>`}</section>
  <button class="btn block" data-go="#/consultas">Ver minhas consultas</button>
  <button class="btn ghost block" data-go="#/">Voltar ao início</button></div>`;}
function shareText(a){const u=UNITS[a.unitId];return `Consulta agendada pelo Agiliza Saúde (teste)\n${SVC[a.svc].nome} — ${a.paciente.nome}\n${fmtLong(a.date)}, às ${a.time}\n${u.nome} — ${u.end}, ${u.bairro}\nProtocolo ${a.protocolo}`;}

function apptsPage(){const today=iso(new Date());const all=appts().slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const up=all.filter(a=>a.status==='agendada'&&a.date>=today),hist=all.filter(a=>!(a.status==='agendada'&&a.date>=today)).reverse();
  const card=(a,active)=>{const u=UNITS[a.unitId];return `<article class="unit"><div class="row" style="align-items:flex-start"><span class="emo" aria-hidden="true">${SVC[a.svc].e}</span><div class="grow"><h3>${esc(SVC[a.svc].nome)}</h3><p><b>${esc(fmtLong(a.date))}, às ${a.time}</b></p><p class="muted small">${esc(u.nome)} · ${esc(u.bairro)}</p><p class="muted small">Paciente: ${esc(a.paciente.nome)} · Protocolo ${a.protocolo}</p></div>
    <span class="tag ${a.status==='cancelada'?'r':active?'g':''}">${a.status==='cancelada'?'Cancelada':active?'Agendada':'Realizada'}</span></div>
    ${active?`<div class="acts"><button class="btn" data-act="remarcar" data-id="${a.id}">Remarcar</button><button class="btn danger" data-act="askcancel" data-id="${a.id}">Cancelar</button><button class="btn ghost" data-go="#/ok/${a.id}">Detalhes</button></div>`:''}</article>`;};
  return `<div class="stack"><h1>Minhas consultas</h1>
  ${up.length?`<div class="list">${up.map(a=>card(a,true)).join('')}</div>`:`<section class="card center stack"><p style="font-size:2.2rem" aria-hidden="true">📭</p><p><b>Você não tem consultas agendadas.</b></p><button class="btn" data-act="start">Agendar consulta</button></section>`}

  ${hist.length?`<h2>Histórico</h2><div class="list">${hist.map(a=>card(a,false)).join('')}</div>`:''}</div>`;}

function dataPage(){const log=store.get('log',[]);const cols=['quando','sessao','evento','aparelho','servico','unidade','bairro','data','hora','para_quem','duracao_s','voltas','nota','comentario','origem','fonte','contraste'];
  return `<div class="stack"><h1>Dados dos testes (equipe)</h1><p class="muted">Registros guardados <b>neste aparelho</b>. ${CONFIG.ENDPOINT?'Também estão sendo enviados para a planilha configurada.':'Nenhuma planilha configurada — veja o README para receber os dados de todos os aparelhos.'}</p>

  <div class="card scroll"><table class="log"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${log.slice().reverse().map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">Sem registros ainda.</td></tr>`}</tbody></table></div></div>`;}
const LOGCOLS=['quando','sessao','evento','aparelho','servico','unidade','bairro','data','hora','para_quem','duracao_s','voltas','nota','comentario','origem','fonte','contraste'];

/* ============================= ROTAS ================================ */
function render(focus=true){
  const h=location.hash||'#/';let html;
  if(h.startsWith('#/agendar'))html=wizard();
  else if(h.startsWith('#/consultas'))html=apptsPage();
  else if(h.startsWith('#/unidades'))html=unitsPage();
  else if(h.startsWith('#/unidade/'))html=unitPage(+h.split('/')[2]);
  else if(h.startsWith('#/perfil'))html=identify(false);
  else if(h.startsWith('#/ok/'))html=successPage(h.split('/')[2]);
  else if(h.startsWith('#/dados'))html=dataPage();
  else html=home();
  app.innerHTML=html;drawNav();
  if(focus){window.scrollTo(0,0);const t=app.querySelector('h1');if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true});say(t.textContent);}}
  const sel=app.querySelector('.day[aria-pressed=true]');if(sel&&sel.scrollIntoView)sel.scrollIntoView({inline:'center',block:'nearest'});
}
function go(h){if(location.hash===h)render();else location.hash=h;}
addEventListener('hashchange',()=>render());
function refreshList(){const el=$('#ulist');if(el)el.innerHTML=unitList(W&&location.hash.startsWith('#/agendar')?W.svc:UF.svc,location.hash.startsWith('#/agendar'));}
function setStep(n){W.step=n;render();}

/* ============================= AÇÕES ================================ */
function startFlow(preset){newWizard(preset);UF.limit=10;go('#/agendar');}
function doGeo(){if(!navigator.geolocation){toast('Seu navegador não permite localização. Escolha seu bairro.');return;}
  toast('Buscando sua localização…');
  navigator.geolocation.getCurrentPosition(pos=>{store.set('ref',{lat:pos.coords.latitude,lng:pos.coords.longitude,label:'sua localização'});UF.bairro='';UF.sort='';track('usou_localizacao',{origem:'gps'});render(false);toast('Pronto! Unidades mais próximas primeiro.');},
    ()=>{toast('Não foi possível obter a localização. Escolha seu bairro na lista.');const s=$('#ub');if(s)s.focus();},{timeout:8000,maximumAge:6e5});}
function confirmBooking(){
  const u=UNITS[W.unitId];const ok=slots(u,W.svc,W.date,W.editId);
  if(!ok||!ok.includes(W.time)){toast('Esse horário acabou de ser preenchido. Escolha outro.');W.time=null;setStep(4);return;}
  const list=appts();let a;const dur=Math.round((Date.now()-W.t0)/1000);
  if(W.editId){a=list.find(x=>x.id===W.editId);Object.assign(a,{date:W.date,time:W.time,unitId:W.unitId,lembrete:W.lembrete,remarcada:true});}
  else{a={id:Date.now().toString(36),protocolo:'AGS-'+String(Math.floor(100000+Math.random()*900000)),paciente:W.paciente,svc:W.svc,unitId:W.unitId,date:W.date,time:W.time,lembrete:W.lembrete,status:'agendada',criado:new Date().toISOString()};list.push(a);}
  store.set('appts',list);
  track(W.editId?'remarcou':'agendou',{servico:SVC[a.svc].nome,unidade:u.nome,bairro:u.bairro,data:a.date,hora:a.time,para_quem:a.paciente.rel?'outra pessoa':'proprio',duracao_s:dur,voltas:W.voltas,origem:W.origem});
  W=null;go('#/ok/'+a.id);
}
function ics(a){const u=UNITS[a.unitId];const s=a.date.replace(/-/g,'')+'T'+a.time.replace(':','')+'00';const e=new Date(fromIso(a.date));const [hh,mm]=a.time.split(':').map(Number);e.setHours(hh,mm+30);
  const en=iso(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Agiliza Saude//PT','BEGIN:VEVENT','UID:'+a.id+'@agilizasaude','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+s,'DTEND:'+en,'SUMMARY:'+SVC[a.svc].nome+' - '+u.nome,'LOCATION:'+(u.end+' - '+u.bairro+' - Jaboatão dos Guararapes').replace(/,/g,'\\,'),'DESCRIPTION:Paciente: '+a.paciente.nome+'. Protocolo '+a.protocolo+'. Leve documento com foto e Cartão SUS.','BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Consulta amanhã','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  download('consulta-agiliza-saude.ics',txt,'text/calendar');}
function download(name,txt,type){const b=new Blob([txt],{type:type+';charset=utf-8'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),2000);}
function a11yPanel(){const p=store.get('prefs',{});modal(`<h2>Acessibilidade</h2>
  <p class="f" style="margin-top:1rem;font-weight:700">Tamanho do texto</p>
  <div class="row"><button class="btn ghost grow" data-act="font" data-v="-1" aria-label="Diminuir texto">A−</button><button class="btn ghost grow" data-act="font" data-v="0">Padrão</button><button class="btn ghost grow" data-act="font" data-v="1" aria-label="Aumentar texto" style="font-size:1.25rem">A+</button></div>
  <label class="row" style="margin-top:1.1rem;cursor:pointer"><input type="checkbox" id="hc" ${p.hc?'checked':''} style="width:1.5rem;height:1.5rem"><span><b>Alto contraste</b><br><span class="muted small">Fundo escuro e cores fortes.</span></span></label>
  <button class="btn block" data-act="close" style="margin-top:1.2rem">Concluir</button>`);}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.go==='#/agendar'&&!W){startFlow({origem:'menu'});return;}go(g.dataset.go);return;}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='close-ov'){if(e.target===b)closeModal();return;}
  if(b.disabled)return;
  switch(act){
    case 'start':startFlow({origem:'inicio'});break;
    case 'near':go('#/unidades');doGeo();break;
    case 'a11y':a11yPanel();break;
    case 'close':closeModal();break;
    case 'font':{const p=store.get('prefs',{});const v=+b.dataset.v;p.font=v===0?0:Math.max(-1,Math.min(3,(p.font||0)+v));store.set('prefs',p);applyPrefs();track('acessibilidade',{origem:'fonte '+p.font});break;}
    case 'wback':if(!W||W.step<=1||(W.editId&&W.step===4)||(W.origem==='unidade'&&W.step===4)){const back=W&&W.editId?'#/consultas':W&&W.origem==='unidade'?'#/unidade/'+W.unitId:'#/';W=null;go(back);}else{W.voltas++;if(W.step===4)W.time=null;setStep(W.step-1);}break;
    case 'wnext':setStep(W.step+1);break;
    case 'pac':{const i=+b.dataset.i;const p=profile();W.paciente=i<0?{nome:p.nome}:store.get('deps',[])[i];setStep(W.svc&&W.unitId!=null?4:2);break;}
    case 'newdep':modal(`<h2>Para quem é a consulta?</h2><form id="fdep" class="fgrid" style="margin-top:1rem" novalidate>
      <div><label class="f" for="dn">Nome completo da pessoa</label><input class="inp" id="dn" required></div>
      <div><label class="f" for="dr">Quem é essa pessoa para você?</label><select class="inp" id="dr"><option>Filho(a)</option><option>Mãe / Pai</option><option>Avó / Avô</option><option>Cônjuge</option><option>Outro familiar</option><option>Pessoa que acompanho</option></select></div>
      <p class="err" id="derr" role="alert" hidden></p>
      <button class="btn block" type="submit">Continuar</button><button class="btn ghost block" type="button" data-act="close">Cancelar</button></form>`);$('#dn').focus();break;
    case 'svc':W.svc=b.dataset.id;W.unitId=null;W.date=null;W.time=null;UF.limit=10;setStep(3);break;
    case 'pickunit':W.unitId=+b.dataset.id;W.date=null;W.time=null;setStep(4);break;
    case 'otherunit':W.voltas++;W.time=null;W.date=null;if(W.editId)W.editUnit=true;setStep(3);break;
    case 'day':W.date=b.dataset.d;W.time=null;render(false);{const h=app.querySelector('.card h2');if(h)say(h.textContent);}break;
    case 'time':W.time=b.dataset.t;app.querySelectorAll('.time').forEach(x=>x.setAttribute('aria-pressed',x===b));{const n=app.querySelector('[data-act=wnext]');n.disabled=false;n.scrollIntoView({block:'nearest',behavior:'smooth'});}break;
    case 'confirm':{const c=$('#lemb');W.lembrete=c?c.checked:true;confirmBooking();break;}
    case 'geo':doGeo();break;
    case 'clearref':store.set('ref',null);UF.bairro='';render(false);break;
    case 'fnoite':UF.noite=!UF.noite;b.setAttribute('aria-pressed',UF.noite);UF.limit=10;refreshList();break;
    case 'fsab':UF.sabado=!UF.sabado;b.setAttribute('aria-pressed',UF.sabado);UF.limit=10;refreshList();break;
    case 'fsort':UF.sort=UF.sort==='vaga'?'':'vaga';b.setAttribute('aria-pressed',UF.sort==='vaga');refreshList();break;
    case 'more':UF.limit+=10;refreshList();break;
    case 'unitsvc':{const p=profile();startFlow({origem:'unidade',svc:b.dataset.s,unitId:+b.dataset.u,step:1});break;}
    case 'remarcar':{const a=appts().find(x=>x.id===b.dataset.id);startFlow({origem:'remarcar',editId:a.id,paciente:a.paciente,svc:a.svc,unitId:a.unitId,step:4});break;}
    case 'askcancel':{const a=appts().find(x=>x.id===b.dataset.id);modal(`<h2>Cancelar esta consulta?</h2><p class="muted" style="margin:.6rem 0 1rem">${esc(SVC[a.svc].nome)} · ${esc(fmtLong(a.date))}, às ${a.time}<br>A vaga será liberada para outra pessoa.</p>
      <div class="stack"><button class="btn danger block" data-act="cancel" data-id="${a.id}">Sim, cancelar consulta</button><button class="btn block" data-act="remarcar2" data-id="${a.id}">Prefiro remarcar</button><button class="btn ghost block" data-act="close">Manter consulta</button></div>`);break;}
    case 'remarcar2':{closeModal();const a=appts().find(x=>x.id===b.dataset.id);startFlow({origem:'remarcar',editId:a.id,paciente:a.paciente,svc:a.svc,unitId:a.unitId,step:4});break;}
    case 'cancel':{const list=appts();const a=list.find(x=>x.id===b.dataset.id);a.status='cancelada';store.set('appts',list);track('cancelou',{servico:SVC[a.svc].nome,unidade:UNITS[a.unitId].nome,bairro:UNITS[a.unitId].bairro,data:a.date,hora:a.time});closeModal();render();toast('Consulta cancelada.');break;}
    case 'ics':ics(appts().find(x=>x.id===b.dataset.id));break;
    case 'face':app.querySelectorAll('.face').forEach(x=>x.setAttribute('aria-pressed',x===b));break;
    case 'sendfb':{const f=app.querySelector('.face[aria-pressed=true]');if(!f){toast('Toque em uma das carinhas para dar sua nota.');return;}
      const c=$('#fbt').value.trim().slice(0,500);store.set('fb_'+b.dataset.id,{n:+f.dataset.n});track('opiniao',{nota:+f.dataset.n,comentario:c});$('#fbbox').innerHTML='<p class="center"><b>Obrigado pela sua opinião! 💚</b></p>';say('Obrigado pela sua opinião');break;}
    case 'logout':store.set('profile',null);store.set('deps',[]);store.set('appts',[]);W=null;go('#/');toast('Seus dados foram apagados deste aparelho.');break;
    case 'csv':{const log=store.get('log',[]);const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';download('agiliza-saude-testes.csv','﻿'+[LOGCOLS.join(';')].concat(log.map(r=>LOGCOLS.map(c=>q(r[c])).join(';'))).join('\r\n'),'text/csv');break;}
    case 'reset':modal(`<h2>Zerar este aparelho?</h2><p class="muted" style="margin:.6rem 0 1rem">Apaga perfil, consultas e registros locais para o próximo participante começar do zero. Baixe o CSV antes, se ainda não baixou.</p><div class="stack"><button class="btn danger block" data-act="reset2">Sim, zerar</button><button class="btn ghost block" data-act="close">Voltar</button></div>`);break;
    case 'reset2':store.clear();SID=Math.random().toString(36).slice(2,10);store.set('sid',SID);W=null;closeModal();applyPrefs();go('#/');toast('Aparelho zerado.');break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='hc'){const p=store.get('prefs',{});p.hc=e.target.checked;store.set('prefs',p);applyPrefs();track('acessibilidade',{origem:'contraste '+(p.hc?'on':'off')});}
  if(e.target.id==='ub'){UF.bairro=e.target.value;const g=bairroGeo(UF.bairro);if(g){store.set('ref',{lat:g.lat,lng:g.lng,label:UF.bairro});UF.sort='';track('usou_localizacao',{origem:'bairro',bairro:UF.bairro});}else store.set('ref',null);UF.limit=10;render(false);const s=$('#ub');if(s)s.focus();}
  if(e.target.id==='us'){UF.svc=e.target.value;UF.limit=10;refreshList();}
});
document.addEventListener('input',e=>{if(e.target.id==='uq'){UF.q=e.target.value;UF.limit=10;refreshList();}
  if(e.target.id==='pf'){let d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.length>7?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d;}
  if(e.target.id==='pd'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,15);}});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='fid'){const nome=$('#pn').value.trim(),doc=$('#pd').value.trim(),fone=$('#pf').value.trim();const er=$('#ferr');let m='';
    if(nome.length<3)m='Digite seu nome completo.';else if(doc.length!==11&&doc.length!==15)m='O CPF tem 11 números e o Cartão SUS tem 15. Confira o número digitado.';else if(fone.replace(/\D/g,'').length<10)m='Digite o celular com DDD.';
    if(m){er.textContent=m;er.hidden=false;return;}
    const novo=!profile();store.set('profile',{nome,doc,fone});if(novo)track('identificou');
    if(location.hash.startsWith('#/agendar'))render();else{go('#/');toast('Dados salvos.');}}
  if(e.target.id==='fdep'){const nome=$('#dn').value.trim();if(nome.length<3){const er=$('#derr');er.textContent='Digite o nome da pessoa.';er.hidden=false;return;}
    const d={nome,rel:$('#dr').value};const deps=store.get('deps',[]);deps.push(d);store.set('deps',deps);W.paciente=d;closeModal();setStep(W.svc&&W.unitId!=null?4:2);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML)closeModal();});

applyPrefs();render(false);track('abriu_site');
</script>
</body>
</html>
